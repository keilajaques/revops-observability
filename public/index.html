<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observabilidade RevOps — Branddi</title>
<style>
  :root{--bg:#002b36;--surface:#003847;--surface-2:#004c54;--border:#0c5560;--border-soft:#0a4a53;--text:#fff;--text-dim:#94a3b8;--text-faint:#6f8790;--accent:#0acfde;--accent-contrast:#002b36;--accent-soft:rgba(10,207,222,.12);--good:#34d399;--good-soft:rgba(52,211,153,.14);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);--crit:#f87171;--crit-soft:rgba(248,113,113,.16);--turq:#299fb1;--radius:12px;--display:'Archivo','Inter',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;--shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);}
  @media(prefers-color-scheme:light){:root{--bg:#eef4f5;--surface:#fff;--surface-2:#e3edef;--border:#cbdcdf;--border-soft:#dbe8ea;--text:#002b36;--text-dim:#4a6570;--text-faint:#7c949b;--accent:#087f8c;--accent-contrast:#002b36;--accent-soft:rgba(8,127,140,.10);--good:#059669;--good-soft:rgba(5,150,105,.12);--warn:#b45309;--warn-soft:rgba(180,83,9,.12);--crit:#dc2626;--crit-soft:rgba(220,38,38,.10);--turq:#0f6f7c;--shadow:0 1px 2px rgba(0,43,54,.05),0 6px 20px rgba(0,43,54,.06);}}
  *{box-sizing:border-box;}body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;margin:0;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px 90px;}
  header.mast{padding:44px 0 16px;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:9px;}.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  h1{font-family:var(--display);font-size:clamp(28px,4.4vw,42px);line-height:1.06;letter-spacing:-.02em;margin:14px 0 0;font-weight:300;}h1 b{font-weight:600;color:var(--accent);}
  .sub{font-size:16px;color:var(--text-dim);max-width:72ch;margin:14px 0 0;}
  .toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-soft);padding:12px 0;margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;border:1px solid var(--border);}
  .seg button{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 15px;border-radius:999px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;}
  .seg button.on{background:var(--accent);color:var(--accent-contrast);}.seg button:hover:not(.on){color:var(--text);}
  .custom{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--text-faint);}
  .custom.show{display:flex;}
  .custom input{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);}
  .custom button{font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-contrast);border-radius:8px;padding:7px 12px;cursor:pointer;}
  .hint{font-size:12.5px;color:var(--text-faint);}.hint b{color:var(--accent);font-family:var(--mono);}
  .zone{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:38px 0 4px;}
  h2{font-family:var(--display);font-size:21px;margin:24px 0 0;font-weight:600;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:13px;margin-top:15px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 19px;box-shadow:var(--shadow);}
  .kpi .v{font-family:var(--display);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .kpi .v.accent{color:var(--accent);}.kpi .v.crit{color:var(--crit);}.kpi .v.good{color:var(--good);}.kpi .v.warn{color:var(--warn);}
  .kpi .l{font-size:12.5px;color:var(--text-dim);margin-top:7px;}.kpi .pd{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:2px;}
  .funnel{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .fstage{display:flex;align-items:center;gap:12px;padding:5px 0;}.fstage .fl{width:180px;flex:none;font-size:13px;}.fstage .fl small{display:block;color:var(--text-faint);font-family:var(--mono);font-size:10.5px;}
  .fbarwrap{flex:1;}.fbar{height:38px;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--turq));display:flex;align-items:center;padding-left:12px;color:var(--accent-contrast);font-family:var(--mono);font-weight:700;font-size:13px;min-width:64px;transition:width .3s;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
  .loss{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .lrow{display:grid;grid-template-columns:170px 1fr 100px;align-items:center;gap:12px;font-size:13px;}
  .lrow .ll{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lrow .lt{height:18px;background:var(--surface-2);border-radius:5px;overflow:hidden;}.lrow .lf{height:100%;border-radius:5px;background:var(--crit);}
  .lrow .lv{font-family:var(--mono);text-align:right;font-weight:600;font-size:12px;}.lrow .lv small{color:var(--text-faint);font-weight:400;}.lrow .lv .up{color:var(--crit);}.lrow .lv .dn{color:var(--good);}
  .projgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:14px;}
  .proj .pn{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:8px;}.proj .pn small{color:var(--text-faint);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block;}
  .pmet{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px dashed var(--border-soft);}.pmet:first-of-type{border-top:none;}.pmet .pv{font-family:var(--mono);font-weight:700;}
  .cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-top:14px;}
  .cmpc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);}
  .cmpc .ct{font-size:12px;color:var(--text-dim);margin-bottom:10px;}
  .cmpbars{display:flex;gap:8px;align-items:flex-end;height:64px;}.cmpbars .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;}
  .cmpbars .cbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;}.cmpbars .cbl{font-family:var(--mono);font-size:9px;color:var(--text-faint);}.cmpbars .cbv{font-family:var(--mono);font-size:10px;font-weight:700;}
  .alerts{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
  .alert{display:grid;grid-template-columns:12px 1fr auto;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 15px;box-shadow:var(--shadow);}
  .alert .dot{width:10px;height:10px;border-radius:50%;}.alert.red{border-left:3px solid var(--crit);}.alert.red .dot{background:var(--crit);}.alert.amber{border-left:3px solid var(--warn);}.alert.amber .dot{background:var(--warn);}.alert.green{border-left:3px solid var(--good);}.alert.green .dot{background:var(--good);}
  .alert .txt{font-size:13px;}.alert .st{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;}.alert.red .st{color:var(--crit);}.alert.amber .st{color:var(--warn);}.alert.green .st{color:var(--good);}
  .note{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:13px 16px;margin-top:16px;font-size:13.5px;}.note .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent);display:block;margin-bottom:4px;}.note b{font-weight:700;}
  .footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--text-faint);}
  .rb{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);}
  #err{display:none;background:var(--crit-soft);border:1px solid var(--crit);color:var(--crit);border-radius:10px;padding:14px;margin-top:20px;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="kicker">Branddi · RevOps · Observabilidade</div>
    <h1>Saúde do <b>Processo de Enriquecimento</b></h1>
    <p class="sub">Lead Generator → Lia → Enrique. Atualizado todo dia. Escolha o período (presets ou datas) e todos os indicadores recalculam a partir da série diária real.</p>
  </header>
  <div class="toolbar">
    <div class="seg" id="seg">
      <button data-w="hoje">Hoje</button><button data-w="7">7 dias</button><button data-w="15">15 dias</button><button data-w="30" class="on">30 dias</button><button data-w="custom">Personalizado</button>
    </div>
    <div class="custom" id="customBox">
      <input type="date" id="fromD"> <span>→</span> <input type="date" id="toD"> <button id="applyC">Aplicar</button>
    </div>
    <span class="hint">Período: <b id="winlbl">30 dias</b></span>
    <span class="hint" id="updated"></span>
  </div>
  <div id="err"></div>
  <main id="app"></main>
  <div class="footer" id="footer"></div>
</div>

<!--INLINE_DATA-->
<script>
const nf = new Intl.NumberFormat('pt-BR');
const money = v => 'R$ ' + (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
let DATA=null, mode='30', cFrom=null, cTo=null;

function dayMinus(anchor,n){ const d=new Date(anchor+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
function range(){ const t=DATA.todayBRT||Object.keys(DATA.daily||{}).sort().pop(); if(mode==='hoje')return[t,t]; if(mode==='7')return[dayMinus(t,6),t]; if(mode==='15')return[dayMinus(t,14),t]; if(mode==='30')return[dayMinus(t,29),t]; return[cFrom||dayMinus(t,29), cTo||t]; }
function nDays(a,b){ return Math.max(1, Math.round((new Date(b+'T12Z')-new Date(a+'T12Z'))/864e5)+1); }
function sumRange(a,b){ const acc={created:0,lost:0,lost462:0,csScored:0,csApproved:0,autoTotal:0,infra:0,semrushUnits:0,semrushCalls:0,semrushHits:0,contactsNew:0,cEmail:0,cLinkedin:0,cPhone:0,cApollo:0,cVerified:0,opecCalls:0,opecCredits:0,opecCost:0}; const dd=DATA.daily||{}; for(const k in dd){ if(k>=a&&k<=b){ for(const f in acc) acc[f]+=(dd[k][f]||0); } } return acc; }
function label(){ const [a,b]=range(); if(mode==='hoje')return 'hoje ('+a+')'; if(mode==='custom')return a+' → '+b; return mode+' dias'; }

function kpi(v,l,cls,pd){ return `<div class="kpi"><div class="v ${cls||''}">${v}</div><div class="l">${l}</div>${pd?`<div class="pd">${pd}</div>`:''}</div>`; }

function render(){
  if(!DATA) return;
  const [a,b]=range(); const w=sumRange(a,b); const days=nDays(a,b);
  const perDay=v=>nf.format(Math.round((v||0)/days))+'/dia';
  const csRate = w.csScored? w.csApproved/w.csScored*100 : 0;
  const rel = w.autoTotal? (1-w.infra/w.autoTotal)*100 : 100;
  const cache = w.semrushCalls? w.semrushHits/w.semrushCalls*100 : 0;
  document.getElementById('winlbl').textContent = label();
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on', x.dataset.w===mode));
  document.getElementById('customBox').classList.toggle('show', mode==='custom');

  let h='';
  h+=`<div class="zone">Topo · leitura rápida</div><h2>KPIs principais</h2><div class="kpis">`;
  h+=kpi(nf.format(w.created),'Captados <small style="color:var(--text-faint)">(nascidos)</small>','accent',perDay(w.created));
  h+=kpi(pct(csRate),'Taxa de aprovação (Lia)','');
  h+=kpi(pct(rel),'Confiabilidade técnica','good');
  h+=kpi(nf.format(w.lost),'Perdidos <small style="color:var(--text-faint)">(baixados · inc. backlog)</small>','crit',perDay(w.lost));
  h+=kpi(nf.format(w.csScored),'Pontuados no CS','');
  h+=kpi(nf.format(w.csApproved),'Aprovados (seguem)','good');
  h+=`</div>`;
  h+=`<div class="note"><span class="tag">Como ler estes números</span><b>Captados</b> = cards que <b>nasceram</b> no período (data de criação). <b>Perdidos</b> = cards <b>baixados</b> no período (data da perda), inclusive de coortes antigas — por isso "perdidos" pode passar "captados" num dia: a máquina drena backlog. E ~87% da captação morre no <b>mesmo dia</b> no Company Score. Não é o mesmo conjunto de cards.</div>`;
  h+=alertsHtml(w,cache);

  // funil
  h+=`<div class="zone">Meio · diagnóstico</div><h2>Funil (throughput no período)</h2>`;
  const mx=Math.max(w.created,w.csScored,1);
  h+=`<div class="funnel">
    <div class="fstage"><div class="fl">Captação<small>Lead Gen</small></div><div class="fbarwrap"><div class="fbar" style="width:100%">${nf.format(w.created)}</div></div></div>
    <div class="fstage"><div class="fl">Company Score<small>Lia · pontuados</small></div><div class="fbarwrap"><div class="fbar" style="width:${Math.max(6,w.csScored/mx*100)}%">${nf.format(w.csScored)}</div></div></div>
    <div class="fstage"><div class="fl">Aprovados<small>seguem no funil</small></div><div class="fbarwrap"><div class="fbar" style="width:${Math.max(6,w.csApproved/mx*100)}%;background:var(--good)">${nf.format(w.csApproved)} · ${pct(csRate)}</div></div></div>
  </div>`;
  h+=`<div class="note"><span class="tag">Leitura</span>Throughput por etapa no intervalo selecionado (a Lia re-pontua e drena backlog — não é coorte única). Reprovados: <b>${nf.format(w.csScored-w.csApproved)}</b>. Perdas no Company Score: <b>${nf.format(w.lost462)}</b>.</div>`;

  // Company Score — histograma de distribuição (30d)
  const H=DATA.csHistogram;
  if(H && H.distinctDeals){
    const hmax=Math.max(...H.buckets.map(b=>b.total),1);
    const below=H.buckets.filter(b=>b.range==='0–1'||b.range==='1–2').reduce((s,b)=>s+b.total,0);
    h+=`<h2>Company Score — distribuição <small style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">· 30 dias · corte ${String(H.threshold).replace('.',',')}</small></h2><div class="card">`;
    h+=`<div style="display:flex;gap:12px;align-items:flex-end;height:150px;padding-top:8px;">`;
    for(const b of H.buckets){ h+=`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;">
      <span style="font-family:var(--mono);font-size:11px;font-weight:700">${nf.format(b.total)}</span>
      <div style="width:100%;height:${b.total/hmax*100}%;min-height:3px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:5px 5px 0 0;overflow:hidden;">
        <div style="height:${b.total?b.approved/b.total*100:0}%;background:var(--good)"></div>
        <div style="height:${b.total?b.reproved/b.total*100:0}%;background:var(--crit)"></div>
      </div>
      <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim)">${b.range}</span></div>`; }
    h+=`</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text-dim)"><span><span style="display:inline-block;width:10px;height:10px;background:var(--good);border-radius:2px"></span> aprovado</span><span><span style="display:inline-block;width:10px;height:10px;background:var(--crit);border-radius:2px"></span> reprovado</span><span style="margin-left:auto">score médio — aprovado <b style="color:var(--good)">${String(H.avgApproved).replace('.',',')}</b> · reprovado <b style="color:var(--crit)">${String(H.avgReproved).replace('.',',')}</b></span></div>`;
    h+=`<div class="note" style="margin-top:14px"><span class="tag">Leitura</span><b>${pct(below/H.distinctDeals*100)}</b> das ${nf.format(H.distinctDeals)} empresas pontuadas ficam <b>abaixo do corte ${String(H.threshold).replace('.',',')}</b> — a massa vive em 0–1. É o afunilamento central: corte apertado demais OU lead de entrada fraco?</div></div>`;
  }

  // Funil ao vivo — cards abertos agora por etapa (fan-out por produto)
  const O=DATA.openByStage||{};
  const STG=[['Novo Lead','novo460'],['Requalificação','requa461'],['Company Score','cs462'],['Product BB','bb463'],['Product BBP','bbp464'],['Product Golpes','golpes465'],['Product VM','vm466'],['Garimpo','garimpo467'],['Prospecção','prospeccao434']];
  const omax=Math.max(...STG.map(([,k])=>O[k]||0),1);
  h+=`<h2>Funil ao vivo — abertos agora por etapa <small style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">· snapshot</small></h2><div class="card"><div class="loss">`;
  for(const [lbl,k] of STG){ const v=O[k]||0; const stuck=(k==='golpes465'||k==='vm466');
    h+=`<div class="lrow"><span class="ll">${lbl}${stuck?' <span style="color:var(--crit);font-size:10px">🔴 sem handler</span>':''}</span><span class="lt"><span class="lf" style="width:${v/omax*100}%;background:${stuck?'var(--crit)':'var(--accent)'}"></span></span><span class="lv">${nf.format(v)}</span></div>`; }
  h+=`</div><div class="note crit" style="margin-top:12px"><span class="tag">Gargalo estrutural</span><b>${nf.format((O.golpes465||0)+(O.vm466||0))} cards represados em Golpes + VM</b> — sem score de produto implementado (só BB e fraude têm gatilho de avanço), ficam presos. Prospecção ativa: ${nf.format(O.prospeccao434||0)}.</div></div>`;

  // motivos (janela fixa 30d)
  h+=`<h2>Motivos de perda <small style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">· 30 dias</small></h2>`;
  const LS=DATA.lossSummary;
  if(LS && LS.total){ const tt=LS.total;
    h+=`<div style="display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-top:12px;font-family:var(--mono);font-size:11px;font-weight:700;box-shadow:var(--shadow)">
      <div style="width:${LS.recuperavel/tt*100}%;background:var(--warn);color:#00232c;display:flex;align-items:center;justify-content:center" title="Recuperável (falso negativo re-drivável)">Recuperável · ${pct(LS.recuperavel/tt*100)}</div>
      <div style="width:${LS.legitima/tt*100}%;background:var(--turq);color:#00232c;display:flex;align-items:center;justify-content:center" title="Perda de negócio legítima">Legítima</div>
      <div style="width:${LS.tecnico/tt*100}%;background:var(--crit);color:#fff;display:flex;align-items:center;justify-content:center" title="Erro técnico/infra">Téc.</div>
    </div>`;
  }
  h+=`<div class="card"><div class="loss">`;
  const R=DATA.lossReasons||[]; const rmax=R.length?Math.max(...R.map(r=>r.d30)):1;
  const selo=r=> r.tecnico?'<span style="font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--crit-soft);color:var(--crit)">TÉC</span>':(r.recoverable?'<span style="font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn)">RECUP</span>':'');
  for(const r of R){ const arr=r.ratePerDay7>r.ratePerDay30*1.15?'<span class="up">▲</span>':(r.ratePerDay7<r.ratePerDay30*0.85?'<span class="dn">▼</span>':'▬');
    h+=`<div class="lrow"><span class="ll">${r.label} ${selo(r)}</span><span class="lt"><span class="lf" style="width:${r.d30/rmax*100}%;background:${r.tecnico?'var(--crit)':(r.recoverable?'var(--warn)':'var(--turq)')}"></span></span><span class="lv">${nf.format(r.d30)} <small>${pct(r.share)}</small><br><small>${r.ratePerDay7}/d ${arr}</small></span></div>`; }
  h+=`</div>`;
  if(LS && LS.total) h+=`<div class="note" style="margin-top:12px"><span class="tag">Leitura</span><b>${pct(LS.recuperavel/LS.total*100)}</b> das perdas são <b>recuperáveis</b> (falso negativo re-drivável — ex. marca fraca), não descarte legítimo. Só ${pct(LS.legitima/LS.total*100)} é perda de negócio real; ${pct(LS.tecnico/LS.total*100)} é erro técnico. Prioridade de recuperação de pipeline.</div>`;
  h+=`</div>`;

  // projetos
  h+=`<h2>Visão por projeto</h2><div class="projgrid">`;
  h+=`<div class="card proj"><div class="pn">Lead Generator<small>captação</small></div>
    <div class="pmet"><span>Leads gerados</span><span class="pv">${nf.format(w.created)}</span></div>
    <div class="pmet"><span>Qualificados (Lia)</span><span class="pv" style="color:var(--good)">${nf.format(w.csApproved)}</span></div>
    <div class="pmet"><span>Taxa de qualificação</span><span class="pv">${pct(csRate)}</span></div>
    <div class="pmet"><span>Triagem interna</span><span class="pv"><span class="rb">1 query</span></span></div></div>`;
  h+=`<div class="card proj"><div class="pn">Lia<small>qualificação</small></div>
    <div class="pmet"><span>Cards pontuados</span><span class="pv">${nf.format(w.csScored)}</span></div>
    <div class="pmet"><span>Aprovados</span><span class="pv" style="color:var(--good)">${nf.format(w.csApproved)}</span></div>
    <div class="pmet"><span>Reprovados</span><span class="pv" style="color:var(--crit)">${nf.format(w.csScored-w.csApproved)}</span></div>
    <div class="pmet"><span>Confiabilidade</span><span class="pv" style="color:var(--good)">${pct(rel)}</span></div></div>`;
  const c=DATA.contacts||{};
  const cn=w.contactsNew||0, covE=cn?Math.round(w.cEmail/cn*100):0, covL=cn?Math.round(w.cLinkedin/cn*100):0, covA=cn?Math.round(w.cApollo/cn*100):0;
  h+=`<div class="card proj"><div class="pn">Enrique<small>garimpo · no período</small></div>
    <div class="pmet"><span>Contatos encontrados</span><span class="pv">${nf.format(cn)}</span></div>
    <div class="pmet"><span>E-mails válidos</span><span class="pv" style="color:var(--good)">${nf.format(w.cVerified||0)}</span></div>
    <div class="pmet"><span>Cobertura e-mail / LinkedIn</span><span class="pv">${covE}% / ${covL}%</span></div>
    <div class="pmet"><span>Créditos Apollo (ext.)</span><span class="pv">${nf.format(w.opecCredits||0)} · ${money(w.opecCost||0)}</span></div>
    <div class="pmet"><span>Base acumulada</span><span class="pv" style="color:var(--text-faint)">${nf.format(c.total||0)} contatos · ${nf.format(c.empresas||0)} emp.</span></div></div>`;
  h+=`</div>`;

  // zona Fim · observabilidade
  h+=`<div class="zone">Fim · observabilidade & custo</div>`;
  h+=semrushHtml(w);
  h+=`<h2>Consumo por API — Enrique <small style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">· 30 dias</small></h2>`+providersHtml();
  h+=`<h2>Lead Generator — por que descarta <small style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">· 30 dias</small></h2>`+leadgenHtml();
  h+=`<h2>Comparativo por janela (ritmo/dia)</h2>`+cmpHtml();
  h+=`<h2>Gargalos & Decisões</h2>`+gargalosHtml(w,cache);
  h+=`<div class="footer" style="margin-top:16px;border:none;padding:0">Motivos de perda, histograma, funil ao vivo, consumo por API e comparativo usam janelas fixas (30d/7-15-30); KPIs, funil de throughput e Enrique/no período seguem o filtro.</div>`;
  document.getElementById('app').innerHTML=h;
}

function cmpHtml(){
  const t=DATA.todayBRT||Object.keys(DATA.daily||{}).sort().pop();
  const wins=[['7',6],['15',14],['30',29]];
  const data=wins.map(([lbl,n])=>({lbl,d:sumRange(dayMinus(t,n),t),days:+lbl}));
  const metric=(key,title,color,isRate)=>{
    const vals=data.map(x=> isRate? (x.d.csScored? x.d.csApproved/x.d.csScored*100:0) : x.d[key]/x.days);
    const mx=Math.max(...vals,0.001);
    let b=`<div class="cmpc"><div class="ct">${title}</div><div class="cmpbars">`;
    data.forEach((x,i)=>{ b+=`<div class="cb"><span class="cbv">${isRate?vals[i].toFixed(1):nf.format(Math.round(vals[i]))}</span><div class="cbar" style="height:${Math.max(6,vals[i]/mx*100)}%;background:${color}"></div><span class="cbl">${x.lbl}d</span></div>`; });
    return b+`</div></div>`;
  };
  return `<div class="cmp">`+metric('created','Captados / dia','var(--accent)')+metric('lost','Perdidos / dia','var(--crit)')+metric('csRate','Aprovação Lia (%)','var(--good)',true)+metric('semrushUnits','Semrush units / dia','var(--warn)')+`</div>`;
}

function semrushHtml(w){
  const cache=w.semrushCalls?w.semrushHits/w.semrushCalls*100:0, crit=cache<5;
  const t=DATA.todayBRT||Object.keys(DATA.daily||{}).sort().pop();
  const days=[]; for(let i=13;i>=0;i--){ const k=dayMinus(t,i); days.push((DATA.daily&&DATA.daily[k])?DATA.daily[k].semrushUnits:0); }
  const smax=Math.max(...days,1);
  const spark=days.map(v=>`<div style="flex:1;height:${v/smax*100}%;min-height:2px;background:var(--warn);border-radius:2px 2px 0 0;opacity:.85"></div>`).join('');
  return `<h2>Semrush — custo & cache <small style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">· período</small></h2>
    <div class="card">
      <div class="kpis" style="margin-top:0">${kpi(nf.format(w.semrushUnits||0),'Units consumidas','warn')}${kpi(nf.format(w.semrushCalls||0),'Chamadas','')}${kpi(pct(cache),'Cache hit',crit?'crit':'good')}</div>
      <div style="display:flex;gap:3px;align-items:flex-end;height:56px;margin-top:16px">${spark}</div>
      <div style="font-size:11px;color:var(--text-faint);margin-top:6px;font-family:var(--mono)">units/dia · últimos 14 dias</div>
      ${crit?`<div class="note crit" style="margin-top:12px"><span class="tag">Dreno de crédito</span>Cache hit de <b>${pct(cache)}</b> (ideal ≥ 30%) — quase toda consulta é cobrada. Consertar o cache é economia direta, sem perder cobertura.</div>`:''}
    </div>`;
}

function providersHtml(){
  const P=DATA.providers||[];
  if(!P.length) return `<div class="note"><span class="tag">Aguardando fonte</span>Consumo por API (Apollo · Findymail · FullEnrich · Debounce · CNPJá) com <b>chamadas, taxa de erro, créditos e R$</b> vive no schema <code>garimpo</code> do Enrique. Assim que o secret <b>ENRIQUE_SERVICE_ROLE_KEY</b> entrar, este painel popula sozinho — inclusive somando os runs internos que o OPEC não enxerga.</div>`;
  const cmax=Math.max(...P.map(p=>p.credits),1);
  const rows=P.map(p=>{ const col=p.successRate>=70?'var(--good)':(p.successRate>=40?'var(--warn)':'var(--crit)');
    return `<div class="lrow"><span class="ll">${p.name}</span><span class="lt"><span class="lf" style="width:${p.credits/cmax*100}%;background:var(--accent)"></span></span><span class="lv">${nf.format(p.credits)} cr${p.brl?' · '+money(p.brl):''}<br><small style="color:${col}">${p.successRate}% ok · ${p.errorRate}% erro · ${nf.format(p.calls)} cham.</small></span></div>`; }).join('');
  return `<div class="card"><div class="loss">${rows}</div></div>`;
}

function leadgenHtml(){
  const L=DATA.leadgen;
  if(!L || !L.skipped) return `<div class="note"><span class="tag">Aguardando fonte</span>Os motivos de descarte do Lead Generator (dedup, marca de cliente, domínio inválido/sem site, falha técnica de dedup) vivem em <code>qualification_leads_run</code> — no Supabase do Lead Generator, que não é a mesma instância da Lia (retornou 404 aqui). Adicionar <b>LEADGEN_SUPABASE_URL / LEADGEN_SERVICE_ROLE_KEY</b> popula este painel.</div>`;
  const mmax=Math.max(...L.reasons.map(r=>r.count),1);
  const rows=L.reasons.map(r=>`<div class="lrow"><span class="ll">${r.label} ${r.tecnico?'<span style="font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--crit-soft);color:var(--crit)">TÉC</span>':''}</span><span class="lt"><span class="lf" style="width:${r.count/mmax*100}%;background:${r.tecnico?'var(--crit)':'var(--text-faint)'}"></span></span><span class="lv">${nf.format(r.count)}</span></div>`).join('');
  return `<div class="card"><div class="kpis" style="margin-top:0">${kpi(nf.format(L.created),'Criados','good')}${kpi(nf.format(L.reopened),'Reabertos','accent')}${kpi(nf.format(L.skipped),'Descartados','crit')}</div><div class="loss" style="margin-top:14px">${rows}</div></div>`;
}

function gargalosHtml(w,cache){
  const O=DATA.openByStage||{}, LS=DATA.lossSummary||{}, P=DATA.providers||[], rows=[];
  const stuck=(O.golpes465||0)+(O.vm466||0);
  if(stuck>100) rows.push(['crit','Crítico','Lia',`Golpes + VM represados (${nf.format(stuck)} cards)`,'Implementar score de produto/gatilho de avanço p/ GD e VM (hoje só BB e fraude); enquanto isso, decidir mutirão manual.']);
  if((LS.recuperavel||0)>500) rows.push(['crit','Falso negativo','Lia',`${nf.format(LS.recuperavel)} perdas recuperáveis (${pct(LS.recuperavel/(LS.total||1)*100)})`,'Auditar amostra de weak_pure_brand e criar trilha de reprocessamento antes de descartar.']);
  if(cache<5 && w.semrushCalls>50) rows.push(['amber','Atenção','Enrique/RevOps',`Cache Semrush em ${pct(cache)}`,'Consertar o cache pra parar de re-consultar e queimar crédito.']);
  const bad=P.filter(p=>p.errorRate>=60 && p.calls>50); if(bad.length) rows.push(['amber','Atenção','Enrique',`Waterfall com baixo acerto: ${bad.map(p=>p.name).join(', ')}`,'Reordenar/cortar providers de baixo yield na cascata.']);
  rows.push(['accent','Oportunidade','RevOps','Conversão por etapa invisível','Ligar coletor do /deals/flow do Pipedrive pra reconstruir transições, mortalidade por etapa e falso positivo.']);
  if(!P.length) rows.push(['amber','Pendência','RevOps','Consumo por API do garimpo cego','Adicionar ENRIQUE_SERVICE_ROLE_KEY pra medir erro/crédito por provider.']);
  if(!DATA.leadgen||!DATA.leadgen.skipped) rows.push(['amber','Pendência','RevOps','Descartes do Lead Generator cegos','Adicionar creds do Supabase do Lead Generator (qualification_leads_run).']);
  const sc={crit:'var(--crit)',amber:'var(--warn)',accent:'var(--accent)'};
  return `<div class="card">`+rows.map((r,i)=>`<div style="display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:start;padding:11px 0;${i?'border-top:1px solid var(--border-soft)':''}"><span style="width:9px;height:9px;border-radius:50%;background:${sc[r[0]]};margin-top:5px"></span><div><div style="font-weight:600;font-size:13.5px">${r[3]} <span style="font-family:var(--mono);font-size:9px;color:${sc[r[0]]}">· ${r[1]}</span></div><div style="font-size:12.5px;color:var(--text-dim);margin-top:3px">${r[4]}</div></div><span style="font-family:var(--mono);font-size:10px;color:var(--text-faint);white-space:nowrap">dono: ${r[2]}</span></div>`).join('')+`</div>`;
}

function alertsHtml(w,cache){
  const A=[];
  if(w.semrushCalls>50 && cache<5) A.push(['red','Crítico',`Cache Semrush ineficiente — hit ${pct(cache)} (limiar ≥ 30%).`]);
  const nc=(DATA.lossReasons||[]).find(r=>r.key==='enrique_only_no_contact');
  if(nc && nc.ratePerDay7>nc.ratePerDay30*1.3) A.push(['red','Crítico',`"Sem contato" acelerando — ${nc.ratePerDay7}/dia (7d) vs ${nc.ratePerDay30}/dia (30d).`]);
  const g=DATA.openByStage||{}; if((g.garimpo467||0)>40) A.push(['amber','Atenção',`${g.garimpo467} cards aguardando no Garimpo · ${(g.golpes465||0)+(g.vm466||0)} travados em Golpes/VM.`]);
  const rel=w.autoTotal?(1-w.infra/w.autoTotal)*100:100;
  A.push([rel>=99?'green':'amber',rel>=99?'OK':'Atenção',`Confiabilidade ${pct(rel)} (${nf.format(w.infra)} erros de infra no período).`]);
  return `<div class="alerts">`+A.map(x=>`<div class="alert ${x[0]}"><span class="dot"></span><div class="txt">${x[2]}</div><span class="st">${x[1]}</span></div>`).join('')+`</div>`;
}

document.getElementById('seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; mode=b.dataset.w; if(mode==='custom' && !cFrom){ const t=DATA.todayBRT; cFrom=dayMinus(t,29); cTo=t; document.getElementById('fromD').value=cFrom; document.getElementById('toD').value=cTo; } render(); });
document.getElementById('applyC').addEventListener('click',()=>{ const f=document.getElementById('fromD').value, t=document.getElementById('toD').value; if(f&&t){ cFrom=f<=t?f:t; cTo=f<=t?t:f; mode='custom'; render(); } });

function init(){
  document.getElementById('updated').innerHTML='atualizado: <b>'+(DATA.generatedAtBRT||'?')+'</b>';
  let foot='Dados reais · Pipedrive brandmonitor + Supabase Lia + API OPEC Enrique · atualização diária (GitHub Action).';
  if(DATA.warnings&&DATA.warnings.length) foot+=' Pendências: '+DATA.warnings.join(' · ');
  document.getElementById('footer').textContent=foot;
  render();
}
(async function(){
  if(window.__DATA__){ DATA=window.__DATA__; init(); return; }
  try{ DATA=await (await fetch('data.json?t='+Date.now())).json(); init(); }
  catch(e){ document.getElementById('err').style.display='block'; document.getElementById('err').textContent='Não carregou data.json — rode npm run collect ou aguarde a GitHub Action. '+e.message; }
})();
</script>
</body>
</html>
