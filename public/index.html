<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observabilidade RevOps — Branddi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#00212b; --panel:#00303d; --panel-2:#00404e; --line:#0c5560; --line-2:#0a4954;
    --ink:#eef7f8; --ink-dim:#8fa6ad; --ink-faint:#5f7981;
    --brand:#0acfde; --brand-ink:#00212b; --brand-soft:rgba(10,207,222,.10);
    --pass:#3ddc97; --pass-soft:rgba(61,220,151,.12);
    --leak:#ff6b6b; --leak-soft:rgba(255,107,107,.13);
    --hold:#ffc24b; --hold-soft:rgba(255,194,75,.13);
    --teal:#2f9fb1;
    --r:14px; --shadow:0 1px 0 rgba(255,255,255,.02),0 10px 30px rgba(0,10,14,.35);
    --display:'Archivo','Inter',system-ui,sans-serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;
  }
  @media(prefers-color-scheme:light){:root{
    --bg:#f2f6f7; --panel:#ffffff; --panel-2:#eaf1f2; --line:#d3e0e2; --line-2:#e2ebec;
    --ink:#032630; --ink-dim:#4a6570; --ink-faint:#88a0a7;
    --brand:#078590; --brand-ink:#ffffff; --brand-soft:rgba(7,133,144,.09);
    --pass:#0e9f6e; --pass-soft:rgba(14,159,110,.11); --leak:#e5484d; --leak-soft:rgba(229,72,77,.10);
    --hold:#b8770a; --hold-soft:rgba(184,119,10,.12); --teal:#0e7c8c;
    --shadow:0 1px 0 rgba(0,0,0,.02),0 8px 22px rgba(3,38,48,.07);
  }}
  :root[data-theme="dark"]{color-scheme:dark;}
  :root[data-theme="light"]{--bg:#f2f6f7;--panel:#ffffff;--panel-2:#eaf1f2;--line:#d3e0e2;--line-2:#e2ebec;--ink:#032630;--ink-dim:#4a6570;--ink-faint:#88a0a7;--brand:#078590;--brand-ink:#fff;--brand-soft:rgba(7,133,144,.09);--pass:#0e9f6e;--pass-soft:rgba(14,159,110,.11);--leak:#e5484d;--leak-soft:rgba(229,72,77,.10);--hold:#b8770a;--hold-soft:rgba(184,119,10,.12);--teal:#0e7c8c;--shadow:0 1px 0 rgba(0,0,0,.02),0 8px 22px rgba(3,38,48,.07);color-scheme:light;}

  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;margin:0;-webkit-font-smoothing:antialiased;font-size:15px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 100px;}
  .mono{font-family:var(--mono);}
  .num{font-variant-numeric:tabular-nums;font-family:var(--mono);}

  /* ---- masthead ---- */
  header.mast{padding:40px 0 14px;}
  .kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--brand);font-weight:600;display:flex;align-items:center;gap:9px;}
  .kick::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand);}
  h1{font-family:var(--display);font-size:clamp(27px,4.2vw,40px);line-height:1.04;letter-spacing:-.02em;margin:12px 0 0;font-weight:320;text-wrap:balance;}
  h1 b{font-weight:640;color:var(--brand);}
  .lede{font-size:16px;color:var(--ink-dim);max-width:70ch;margin:12px 0 0;}

  /* ---- toolbar ---- */
  .bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2);padding:11px 0;margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .seg button{font:600 13px var(--sans);padding:7px 15px;border-radius:999px;border:none;background:transparent;color:var(--ink-dim);cursor:pointer;transition:.15s;}
  .seg button.on{background:var(--brand);color:var(--brand-ink);}
  .seg button:hover:not(.on){color:var(--ink);}
  .seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .cbox{display:none;align-items:center;gap:7px;font-size:12px;color:var(--ink-faint);}
  .cbox.show{display:flex;}
  .cbox input{font:12px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);}
  .cbox button{font:600 12px var(--sans);border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:7px 12px;cursor:pointer;}
  .hint{font-size:12px;color:var(--ink-faint);}.hint b{color:var(--brand);font-family:var(--mono);}

  /* ---- section eyebrow ---- */
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:44px 0 2px;}
  h2{font-family:var(--display);font-size:20px;letter-spacing:-.01em;margin:2px 0 0;font-weight:600;}
  h2 .tag{font:400 11px var(--mono);color:var(--ink-faint);letter-spacing:0;text-transform:none;margin-left:8px;}
  .sub{color:var(--ink-dim);font-size:13.5px;margin:8px 0 0;max-width:80ch;}

  /* ---- HERO efficiency band ---- */
  .hero{margin-top:22px;background:radial-gradient(120% 140% at 88% -10%,var(--brand-soft),transparent 55%),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;box-shadow:var(--shadow);}
  .hero .thesis{font-family:var(--display);font-weight:320;font-size:clamp(18px,2.4vw,25px);line-height:1.3;letter-spacing:-.01em;max-width:34ch;}
  .hero .thesis b{font-weight:640;color:var(--brand);}
  .effgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;margin-top:24px;background:var(--line-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;}
  .eff{background:var(--panel);padding:16px 18px;}
  .eff .v{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}
  .eff .v.pass{color:var(--pass);} .eff .v.leak{color:var(--leak);} .eff .v.hold{color:var(--hold);} .eff .v.brand{color:var(--brand);}
  .eff .k{font-size:12px;color:var(--ink-dim);margin-top:8px;line-height:1.35;}
  .eff .k b{color:var(--ink);}
  .eff .d{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:3px;}

  /* ---- funnel (survival) ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);margin-top:16px;}
  .fn{display:flex;flex-direction:column;gap:0;}
  .fn-stage{display:grid;grid-template-columns:180px 1fr 128px;align-items:center;gap:14px;}
  .fn-lab{font-size:14px;font-weight:600;} .fn-lab small{display:block;font:400 10.5px var(--mono);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .fn-track{height:38px;background:var(--panel-2);border-radius:8px;overflow:hidden;display:flex;}
  .fn-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--teal));display:flex;align-items:center;padding-left:13px;color:var(--brand-ink);font:700 13px var(--mono);min-width:52px;transition:width .4s cubic-bezier(.2,.8,.2,1);}
  .fn-fill.pass{background:linear-gradient(90deg,var(--pass),color-mix(in srgb,var(--pass) 60%,var(--panel-2)));}
  .fn-n{text-align:right;font:700 15px var(--mono);font-variant-numeric:tabular-nums;}
  .fn-n small{display:block;font-weight:400;font-size:11px;color:var(--ink-faint);}
  .fn-gap{display:grid;grid-template-columns:180px 1fr 128px;gap:14px;padding:5px 0;}
  .fn-conv{grid-column:2;font:600 11.5px var(--mono);color:var(--ink-dim);display:flex;align-items:center;gap:12px;padding-left:2px;}
  .fn-conv .drop{color:var(--leak);} .fn-conv .keep{color:var(--pass);}

  /* ---- KPI mini ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);}
  .kpi .v{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .kpi .v.pass{color:var(--pass);}.kpi .v.leak{color:var(--leak);}.kpi .v.hold{color:var(--hold);}.kpi .v.brand{color:var(--brand);}
  .kpi .k{font-size:12px;color:var(--ink-dim);margin-top:7px;}
  .kpi .d{font:11px var(--mono);color:var(--ink-faint);margin-top:2px;}

  /* ---- histogram ---- */
  .histo{display:flex;gap:14px;align-items:flex-end;height:158px;padding-top:6px;}
  .histo .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%;}
  .histo .cn{font:700 12px var(--mono);}
  .histo .stk{width:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 0 0;overflow:hidden;min-height:3px;}
  .histo .stk .a{background:var(--pass);} .histo .stk .r{background:var(--leak);}
  .histo .cl{font:11px var(--mono);color:var(--ink-dim);}
  .cutline{position:relative;border-left:2px dashed var(--hold);}

  /* ---- bars (loss list) ---- */
  .bars{display:flex;flex-direction:column;gap:9px;}
  .row{display:grid;grid-template-columns:176px 1fr 104px;align-items:center;gap:13px;font-size:13px;}
  .row .l{color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .t{height:16px;background:var(--panel-2);border-radius:5px;overflow:hidden;}
  .row .f{height:100%;border-radius:5px;background:var(--brand);}
  .row .n{text-align:right;font:600 12px var(--mono);font-variant-numeric:tabular-nums;}
  .row .n small{color:var(--ink-faint);font-weight:400;} .row .n .up{color:var(--leak);}.row .n .dn{color:var(--pass);}
  .selo{font:700 9px var(--mono);padding:1px 5px;border-radius:4px;letter-spacing:.03em;}
  .selo.rec{background:var(--hold-soft);color:var(--hold);} .selo.tec{background:var(--leak-soft);color:var(--leak);}

  /* composition bar */
  .comp{display:flex;height:32px;border-radius:9px;overflow:hidden;border:1px solid var(--line);margin-top:14px;font:700 11px var(--mono);}
  .comp div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;}

  /* project cards */
  .proj3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px;}
  .pc .ph{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;}
  .pc .ph small{font:400 10px var(--mono);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}
  .pm{display:flex;justify-content:space-between;font-size:13px;padding:6.5px 0;border-top:1px solid var(--line-2);}
  .pm:first-of-type{border-top:none;} .pm .pv{font:700 13px var(--mono);}

  /* table */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:16px;background:var(--panel);box-shadow:var(--shadow);}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px;}
  th{background:var(--panel-2);text-align:left;font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th.r,td.r{text-align:right;} td{padding:10px 13px;border-bottom:1px solid var(--line-2);} tr:last-child td{border-bottom:none;}

  /* comparativo */
  .cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px;}
  .cmpc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow);}
  .cmpc .ct{font-size:12px;color:var(--ink-dim);margin-bottom:11px;}
  .cbars{display:flex;gap:9px;align-items:flex-end;height:60px;}
  .cbars .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;}
  .cbars .cbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;}
  .cbars .cl{font:9px var(--mono);color:var(--ink-faint);}.cbars .cvv{font:700 10px var(--mono);}

  /* alerts + gargalos */
  .alerts{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .al{display:grid;grid-template-columns:8px 1fr auto;gap:13px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 15px;box-shadow:var(--shadow);}
  .al .dot{width:8px;height:8px;border-radius:50%;}
  .al.red{border-left:2px solid var(--leak);}.al.red .dot{background:var(--leak);}
  .al.amber{border-left:2px solid var(--hold);}.al.amber .dot{background:var(--hold);}
  .al.green{border-left:2px solid var(--pass);}.al.green .dot{background:var(--pass);}
  .al .tx{font-size:13px;} .al .st{font:700 10px var(--mono);text-transform:uppercase;}
  .al.red .st{color:var(--leak);}.al.amber .st{color:var(--hold);}.al.green .st{color:var(--pass);}
  .gk{display:grid;grid-template-columns:9px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-2);}
  .gk:first-child{border-top:none;} .gk .gd{width:9px;height:9px;border-radius:50%;margin-top:4px;}
  .gk .gt{font-weight:600;font-size:13.5px;} .gk .gt .sv{font:700 9px var(--mono);text-transform:uppercase;}
  .gk .gw{font-size:12.5px;color:var(--ink-dim);margin-top:3px;} .gk .go{font:10px var(--mono);color:var(--ink-faint);white-space:nowrap;}

  .note{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:13.5px;color:var(--ink-dim);}
  .note b{color:var(--ink);font-weight:640;} .note .tag{font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--brand);display:block;margin-bottom:4px;}
  .note.leak{border-color:color-mix(in srgb,var(--leak) 35%,var(--line));background:var(--leak-soft);} .note.leak .tag{color:var(--leak);}
  .spark{display:flex;gap:3px;align-items:flex-end;height:52px;margin-top:14px;}
  .spark div{flex:1;background:var(--hold);border-radius:2px 2px 0 0;min-height:2px;opacity:.85;}
  .rb{font:700 9.5px var(--mono);text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--hold-soft);color:var(--hold);}

  /* ---- painel de operação por sistema ---- */
  .opsum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .opsum .s{flex:1;min-width:118px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
  .opsum .s .n{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
  .opsum .s .l{font-size:11.5px;color:var(--ink-dim);margin-top:6px;}
  .opsum .s.alta .n{color:var(--leak);} .opsum .s.media .n{color:var(--hold);}
  .agrp{margin-top:24px;}
  .agrp-h{display:flex;align-items:center;gap:10px;padding:0 2px 10px;border-bottom:1px solid var(--line-2);margin-bottom:12px;}
  .agrp-dot{width:11px;height:11px;border-radius:3px;flex:none;}
  .agrp-name{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;} .agrp-name small{color:var(--ink-dim);font-weight:400;font-size:12.5px;margin-left:6px;}
  .agrp-sum{margin-left:auto;font:11px var(--mono);color:var(--ink-faint);} .agrp-sum b{color:var(--ink);} .agrp-sum b.hi{color:var(--leak);}
  .agrp-ok{font-size:12.5px;color:var(--ink-dim);padding:2px 2px 4px;}
  .ops{display:flex;flex-direction:column;gap:10px;}
  .inc{display:grid;grid-template-columns:4px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s;}
  .inc:hover{border-color:var(--brand);}
  .inc .ibar{background:var(--ink-faint);}
  .inc.alta .ibar{background:var(--leak);} .inc.media .ibar{background:var(--hold);} .inc.baixa .ibar{background:var(--teal);}
  .inc .ibody{padding:14px 16px;min-width:0;}
  .ihead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .ihead .it{font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.01em;flex:1;min-width:180px;}
  .istage{font:9.5px var(--mono);color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;}
  .prio{font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;}
  .prio.alta{background:var(--leak-soft);color:var(--leak);} .prio.media{background:var(--hold-soft);color:var(--hold);} .prio.baixa{background:var(--panel-2);color:var(--ink-dim);}
  .imx{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0 2px;}
  .imx .im{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;} .imx .im b{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;display:block;line-height:1.05;margin-bottom:3px;letter-spacing:0;}
  .imx .im.warn b{color:var(--leak);} .imx .im .up{color:var(--leak);font-size:10px;font-weight:700;}
  .icause,.iact{font-size:13px;margin-top:10px;display:flex;gap:9px;align-items:baseline;}
  .icause .lbl,.iact .lbl{font:700 8.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);flex:none;width:42px;padding-top:3px;}
  .icause code{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:var(--panel-2);padding:3px 8px;border-radius:6px;word-break:break-word;line-height:1.5;}
  .iact{background:var(--brand-soft);border-radius:8px;padding:10px 12px;margin-top:11px;} .iact .lbl{color:var(--brand);padding-top:2px;} .iact .tx{color:var(--ink);}
  .ifoot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:11px;font:10.5px var(--mono);color:var(--ink-faint);}
  .ifoot .own{color:var(--brand);margin-left:auto;}

  /* ---- conversão por etapa (gates) ---- */
  .gates{display:flex;flex-direction:column;gap:14px;}
  .gate{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .gate-h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;}
  .gate-name{font-family:var(--display);font-weight:600;font-size:15px;} .gate-name small{color:var(--ink-dim);font-weight:400;font-size:12px;margin-left:4px;}
  .gate-sub{font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand);margin-left:auto;}
  .gate-sub.est{background:var(--panel-2);color:var(--ink-faint);}
  .gate-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);font:700 12px var(--mono);}
  .gate-bar .ga{background:var(--pass);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;min-width:36px;}
  .gate-bar .gl{background:var(--leak);color:#fff;display:flex;align-items:center;justify-content:center;min-width:36px;}
  .gate-lg{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--ink-dim);}
  .gate-lg .ok{color:var(--pass);} .gate-lg .bad{color:var(--leak);} .gate-lg b{font-variant-numeric:tabular-nums;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .chip{font:600 11px var(--sans);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-dim);}
  .chip b{color:var(--leak);font-family:var(--mono);}
  .foot{margin-top:46px;padding-top:18px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-faint);}
  #err{display:none;background:var(--leak-soft);border:1px solid var(--leak);color:var(--leak);border-radius:10px;padding:14px;margin-top:20px;}
  @media(max-width:640px){.fn-stage,.fn-gap{grid-template-columns:110px 1fr 84px;}.row{grid-template-columns:120px 1fr 78px;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="kick">Branddi · RevOps · Observabilidade</div>
    <h1>Eficiência do <b>funil de qualificação</b></h1>
    <p class="lede">Lead Generator → Lia → Enrique → Prospecção. Quanto entra, quanto passa, e onde vaza — com o dado real de produção, atualizado todo dia.</p>
  </header>

    <div class="cbox" id="cbox"><input type="date" id="fromD"> <span>→</span> <input type="date" id="toD"> <button id="applyC">Aplicar</button></div>
    <span class="hint">Janela: <b id="winlbl">30 dias</b></span><span class="hint" id="upd"></span>
  </div>

</div>

<!--INLINE_DATA-->
<script>
const nf=new Intl.NumberFormat('pt-BR');
const money=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(v,d=1)=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const p0=v=>Math.round(+v||0)+'%';
let DATA=null,mode='30',cFrom=null,cTo=null;

const dayMinus=(a,n)=>{const d=new Date(a+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-n);return d.toISOString().slice(0,10);};
function range(){const t=DATA.todayBRT||Object.keys(DATA.daily||{}).sort().pop();if(mode==='hoje')return[t,t];if(mode==='7')return[dayMinus(t,6),t];if(mode==='15')return[dayMinus(t,14),t];if(mode==='30')return[dayMinus(t,29),t];return[cFrom||dayMinus(t,29),cTo||t];}
const nDays=(a,b)=>Math.max(1,Math.round((new Date(b+'T12Z')-new Date(a+'T12Z'))/864e5)+1);
function sumRange(a,b){const acc={created:0,lost:0,lost462:0,csScored:0,csApproved:0,autoTotal:0,infra:0,semrushUnits:0,semrushCalls:0,semrushHits:0,contactsNew:0,cEmail:0,cLinkedin:0,cPhone:0,cApollo:0,cVerified:0,opecCalls:0,opecCredits:0,opecCost:0};const dd=DATA.daily||{};for(const k in dd){if(k>=a&&k<=b)for(const f in acc)acc[f]+=(dd[k][f]||0);}return acc;}
function wlabel(){const[a,b]=range();if(mode==='hoje')return'hoje ('+a+')';if(mode==='custom')return a+' → '+b;return mode+' dias';}

// ---- agregadores dos buckets diários por intervalo [a,b] (fazem os painéis obedecerem o filtro) ----
function aggProviders(a,b){
  const dd=DATA.daily||{},rates=DATA.providerRates||{},acc={};let any=false;
  for(const k in dd){if(k<a||k>b)continue;const pv=dd[k].prov;if(!pv)continue;any=true;for(const n in pv){const s=(acc[n]||={calls:0,success:0,credits:0});s.calls+=pv[n].c||0;s.success+=pv[n].s||0;s.credits+=pv[n].cr||0;}}
  if(!any)return DATA.providers||[];
  return Object.entries(acc).map(([name,v])=>({name,calls:v.calls,successRate:v.calls?Math.round(v.success/v.calls*100):0,errorRate:v.calls?Math.round((1-v.success/v.calls)*100):0,credits:Math.round(v.credits),brl:+(v.credits*(rates[name]||0)).toFixed(2)})).sort((x,y)=>y.credits-x.credits);
}
function aggLoss(a,b){
  const dd=DATA.daily||{},meta=DATA.lossMeta||{labels:{},recoverable:[],infra:[]};
  const rec=new Set(meta.recoverable||[]),inf=new Set(meta.infra||[]),lab=meta.labels||{};
  const t=DATA.todayBRT||Object.keys(dd).sort().pop(),a7=dayMinus(t,6);
  const by={},by7={};let any=false;
  for(const k in dd){const ls=dd[k].loss;if(!ls)continue;const inR=(k>=a&&k<=b),in7=(k>=a7&&k<=t);if(!inR&&!in7)continue;for(const key in ls){if(inR){by[key]=(by[key]||0)+ls[key];any=true;}if(in7)by7[key]=(by7[key]||0)+ls[key];}}
  if(!any){const LS=DATA.lossSummary||{};return{total:LS.total||0,tecnico:LS.tecnico||0,recuperavel:LS.recuperavel||0,legitima:LS.legitima||0,reasons:(DATA.lossReasons||[]).map(r=>({key:r.key,label:r.label,count:r.d30,share:r.share,rpd:r.ratePerDay30,rpd7:r.ratePerDay7,recoverable:r.recoverable,tecnico:r.tecnico}))};}
  const days=nDays(a,b);let total=0,tec=0,recu=0,leg=0;
  for(const key in by){total+=by[key];if(inf.has(key))tec+=by[key];else if(rec.has(key))recu+=by[key];else leg+=by[key];}
  const reasons=Object.entries(by).sort((x,y)=>y[1]-x[1]).slice(0,10).map(([key,count])=>({key,label:lab[key]||key,count,share:total?+(count/total*100).toFixed(1):0,rpd:+(count/days).toFixed(1),rpd7:+((by7[key]||0)/7).toFixed(1),recoverable:rec.has(key),tecnico:inf.has(key)}));
  return{total,tecnico:tec,recuperavel:recu,legitima:leg,reasons};
}
function aggCs(a,b){
  const dd=DATA.daily||{},B=[0,0,0,0,0],BA=[0,0,0,0,0],ranges=['0–1','1–2','2–3','3–4','≥4'];let sA=0,nA=0,sR=0,nR=0,any=false;
  for(const k in dd){if(k<a||k>b)continue;const cb=dd[k].csB;if(!cb)continue;any=true;const ba=dd[k].csBA||[0,0,0,0,0];for(let i=0;i<5;i++){B[i]+=cb[i]||0;BA[i]+=ba[i]||0;}sA+=dd[k].csSA||0;nA+=dd[k].csNA||0;sR+=dd[k].csSR||0;nR+=dd[k].csNR||0;}
  if(!any)return DATA.csHistogram||null;
  return{threshold:(DATA.csHistogram&&DATA.csHistogram.threshold)||2,buckets:ranges.map((range,i)=>({range,total:B[i],approved:BA[i],reproved:B[i]-BA[i]})),avgApproved:nA?+(sA/nA).toFixed(2):0,avgReproved:nR?+(sR/nR).toFixed(2):0,distinctDeals:B.reduce((s,x)=>s+x,0)};
}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- Painel de operação: incidentes acionáveis (ação + dono por tipo de erro) ----
const INCIDENT_META={
  lost_weak_pure_brand:{acao:'Auditar amostra (muitos com volume 0 = falha de medição do Semrush) e reavaliar o corte de 10.000; reprocessar os recuperáveis.',dono:'Lia / RevOps'},
  lost_cs_low:{acao:'Revisar calibração do Company Score (corte 2,0); auditar reprovados na faixa 1,5–2.',dono:'Lia'},
  lost_ps_low:{acao:'Revisar calibração do Product Score (corte 2,0).',dono:'Lia'},
  enrique_only_no_contact:{acao:'Buy_box do Enrique indisponível + Apollo off = cooldown permanente. Reprocessar em lote (/api/garimpo/retry) ou reativar um canal de enriquecimento.',dono:'Enrique'},
  garimpo_no_channel:{acao:'Persons sem e-mail/telefone. Garimpar canal via LinkedIn (SDR) ou retry manual.',dono:'Enrique / SDR'},
  garimpo_no_contacts:{acao:'Waterfall retornou 0 decisores. Retry manual ou aceitar ausência de dado.',dono:'Enrique'},
  invalid_produto_principal:{acao:'Produto Principal nulo trava o roteamento e gera loop de retries. Corrigir o preenchimento do campo + pôr limite/idempotência no retry.',dono:'Lia / BBP'},
  bbp_neon_query_error:{acao:'Credencial do Neon inválida (auth falhou p/ reporter_sales_dt). Rotacionar/corrigir a senha desse usuário no Neon e revalidar a query do BBP.',dono:'Lia / BBP'},
  cs_endpoint_failed:{acao:'Endpoint do Company Score em loop (HTTP 200 sem payload; retries na casa dos milhares). Corrigir idempotência/limite de retry e destravar os cards presos.',dono:'Lia'},
  pescaria_travada:{acao:'Pescaria (Product BB) em loop re-checando monitoria. Ativar o fix do loop (MONITORIA_LOOP_FIX) + idempotência no activity-added.',dono:'Lia / serp-monitor'},
  bbp_vc_monitoria_ausente:{acao:'Card BBP sem monitoria da VC associada. Garantir a criação da monitoria antes de entrar no BBP.',dono:'BBP'},
  gd_no_opportunity:{acao:'Descarte legítimo (sem takedown/oportunidade). Revisar critério só se o volume subir.',dono:'Golpes'},
  lost_low_volume:{acao:'Mercado sem agressores no SERP (histórico). Descarte majoritariamente legítimo — monitorar.',dono:'Serp Monitor'},
  lost_duplicate:{acao:'Card duplicado por domínio — dedup funcionando. Nenhuma ação.',dono:'—'},
};
// qual sistema é dono de cada tipo de erro (pra agrupar o painel de operação)
const AGENT_OF={
  lost_weak_pure_brand:'lia',lost_cs_low:'lia',cs_missing_dimensions:'lia',cs_endpoint_failed:'lia',lost_ps_low:'lia',
  invalid_produto_principal:'lia',gd_no_opportunity:'lia',lost_duplicate:'lia',bbp_neon_query_error:'lia',bbp_vc_monitoria_ausente:'lia',represado:'lia',
  lost_low_volume:'serp',pescaria_travada:'serp',all_campaigns_failed:'serp',monitoring_state_error:'serp',semrush_cache:'serp',
  enrique_only_no_contact:'enrique',garimpo_no_channel:'enrique',garimpo_no_contacts:'enrique',
};
const agentOf=t=>t&&t.indexOf('provider_')===0?'enrique':(AGENT_OF[t]||'lia');
const AGENTS=[
  {key:'lia',name:'Lia',sub:'qualificação · Company Score · produto',color:'#8b7ff0'},
  {key:'enrique',name:'Enrique',sub:'enriquecimento · contato',color:'#2f9fb1'},
  {key:'serp',name:'Serp Monitor',sub:'monitoria · pescaria · SERP',color:'#e0a83b'},
  {key:'leadgen',name:'Lead Generator',sub:'captação · dedup na entrada',color:'#0acfde',blind:'Sem telemetria de descarte — vive em qualification_leads_run (Supabase do Lead Gen). Adicionar LEADGEN_SUPABASE_URL/SERVICE_ROLE_KEY popula este bloco.'},
];
function priorityOf(i){
  const accel=i.count7/7 > (i.count/30)*1.3 && i.count7>=10;
  if(i.tecnico && (i.maxRetries>=500 || i.unresolved>=50 || accel)) return 'alta';
  if(i.recoverable && i.deals>=1000) return 'alta';
  if(i.unresolved>=150 && accel) return 'alta';
  if(i.tecnico || (i.recoverable&&i.deals>=100) || i.unresolved>=30) return 'media';
  return 'baixa';
}
function impactOf(i){
  if(i.tecnico) return `${nf.format(i.deals)} cards travados/falhando${i.maxRetries>=100?` · ${nf.format(i.maxRetries)} retries no pior caso (loop)`:''}`;
  if(i.recoverable) return `${nf.format(i.deals)} cards perdidos <b>recuperáveis</b> (falso negativo)`;
  return `${nf.format(i.deals)} descartes (negócio)`;
}
function buildIncidents(){
  const raw=(DATA.incidents||[]).map(i=>({...i,prio:priorityOf(i)})).filter(i=>i.deals>=2||i.count>=3);
  const [a,b]=range(), P=aggProviders(a,b);
  for(const p of P.filter(p=>p.errorRate>=60&&p.calls>50))raw.push({synthetic:1,type:'provider_'+p.name,label:`Waterfall com baixo acerto: ${p.name}`,prio:p.brl>=100?'alta':'media',tecnico:false,recoverable:false,deals:p.calls,_unit:'chamadas',count:p.calls,count7:0,unresolved:0,maxRetries:0,stage:'contatos',topOrgs:[],detail:`${p.errorRate}% de erro em ${nf.format(p.calls)} chamadas · ${money(p.brl)} no período`,_impact:`${money(p.brl)} gastos com ${p.errorRate}% de falha`,_acao:`Reordenar/cortar ${p.name} no waterfall — está queimando crédito sem retorno proporcional.`,_dono:'Enrique'});
  const O=DATA.openByStage||{},st=(O.golpes465||0)+(O.vm466||0);
  if(st>100)raw.push({synthetic:1,type:'represado',label:'Golpes + VM represados sem gatilho de avanço',prio:'alta',tecnico:true,recoverable:false,deals:st,_unit:'cards',count:st,count7:0,unresolved:st,maxRetries:0,stage:'product',topOrgs:[],detail:`${nf.format(st)} cards abertos parados — só BB e fraude têm score de produto`,_impact:`${nf.format(st)} cards de capital parado`,_acao:'Implementar score/gatilho de produto p/ Golpes e VM; enquanto isso, mutirão manual de avanço.',_dono:'Lia / Produto'});
  const wS=sumRange(a,b), cache=wS.semrushCalls?wS.semrushHits/wS.semrushCalls*100:100;
  if(wS.semrushCalls>50&&cache<5)raw.push({synthetic:1,type:'semrush_cache',label:'Cache do Semrush praticamente zerado',prio:'media',tecnico:true,recoverable:false,deals:wS.semrushCalls,_unit:'chamadas',count:wS.semrushCalls,count7:0,unresolved:0,maxRetries:0,stage:'monitoria',topOrgs:[],detail:`cache em ${pct(cache)} · ${nf.format(wS.semrushUnits)} units no período`,_impact:`${nf.format(wS.semrushUnits)} units quase todas cobradas (re-consulta)`,_acao:'Consertar a camada de cache do Semrush pra parar de re-consultar o mesmo termo e queimar crédito.',_dono:'Serp Monitor / RevOps'});
  const order={alta:0,media:1,baixa:2};
  raw.forEach(i=>{if(!i.agent)i.agent=agentOf(i.type);});
  return raw.sort((x,y)=>order[x.prio]-order[y.prio] || (y.deals||0)-(x.deals||0));
}
function incCard(i){
  const meta=INCIDENT_META[i.type]||{};
  const acao=i._acao||meta.acao||(i.tecnico?'Investigar o detalhe do erro e reprocessar os cards afetados.':i.recoverable?'Auditar amostra e reprocessar os recuperáveis.':'Revisar critério de descarte.');
  const dono=i._dono||meta.dono||'RevOps';
  const impact=i._impact||impactOf(i);
  const accel=i.count7/7 > (i.count/30)*1.3 && i.count7>=10;
  const selo=i.tecnico?'<span class="selo tec">TÉC</span>':(i.recoverable?'<span class="selo rec">RECUP</span>':'');
  return `<div class="inc ${i.prio}"><div class="ibar"></div><div class="ibody">
    <div class="ihead"><span class="it">${esc(i.label)}</span>${i.stage?`<span class="istage">@${esc(i.stage)}</span>`:''}${selo}<span class="prio ${i.prio}">${i.prio}</span></div>
    <div class="imx">
      <span class="im"><b>${nf.format(i.deals)}</b>${i._unit||'cards afetados'}</span>
      <span class="im"><b>${nf.format(i.count)}</b>ocorrências${i.count7?` <span class="up">${accel?'▲ ':''}${nf.format(i.count7)}/7d</span>`:''}</span>
      ${i.unresolved?`<span class="im warn"><b>${nf.format(i.unresolved)}</b>não resolvidos</span>`:''}
      ${i.maxRetries>=100?`<span class="im warn"><b>${nf.format(i.maxRetries)}</b>retries (loop)</span>`:''}
    </div>
    <div class="icause"><span class="lbl">Impacto</span><span class="tx">${impact}</span></div>
    ${i.detail?`<div class="icause"><span class="lbl">Causa</span><code>${esc(i.detail)}</code></div>`:''}
    <div class="iact"><span class="lbl">Ação</span><span class="tx">${esc(acao)}</span></div>
    <div class="ifoot">${i.topOrgs&&i.topOrgs.length?`ex.: ${i.topOrgs.map(o=>esc(o.n)).join(' · ')}`:''}<span class="own">dono: ${esc(dono)}</span></div>
  </div></div>`;
}
function opsHtml(){
  const I=buildIncidents();
  const n={alta:0,media:0,baixa:0}; let cards=0;
  I.forEach(x=>{n[x.prio]++; if(!x.synthetic)cards+=x.deals||0;});
  let h=`<div class="opsum">
    <div class="s alta"><div class="n">${n.alta}</div><div class="l">prioridade alta</div></div>
    <div class="s media"><div class="n">${n.media}</div><div class="l">prioridade média</div></div>
    <div class="s"><div class="n">${nf.format(I.length)}</div><div class="l">incidentes ativos</div></div>
    <div class="s"><div class="n">${nf.format(cards)}</div><div class="l">cards impactados (30d)</div></div>
  </div>`;
  for(const ag of AGENTS){
    const list=I.filter(x=>x.agent===ag.key);
    const na=list.filter(x=>x.prio==='alta').length, nd=list.reduce((s,x)=>s+(x.synthetic?0:(x.deals||0)),0);
    h+=`<div class="agrp"><div class="agrp-h"><span class="agrp-dot" style="background:${ag.color}"></span>
      <span class="agrp-name">${ag.name} <small>${ag.sub}</small></span>
      <span class="agrp-sum">${list.length?`<b>${list.length}</b> incidente${list.length>1?'s':''}${na?` · <b class="hi">${na} alta</b>`:''}${nd?` · <b>${nf.format(nd)}</b> cards`:''}`:'sem incidentes'}</span></div>`;
    if(!list.length) h+=`<div class="agrp-ok">${ag.blind?ag.blind:'Nenhum erro ou anomalia registrado no período. ✓'}</div>`;
    else h+=`<div class="ops">`+list.slice(0,6).map(incCard).join('')+(list.length>6?`<div class="agrp-ok">+ ${list.length-6} incidentes menores neste sistema</div>`:'')+`</div>`;
    h+=`</div>`;
  }
  return h;
}
// ---- Conversão por etapa (gates entra/avança/perde + motivos) ----
const STAGE_OF={lost_weak_pure_brand:'cs',lost_cs_low:'cs',lost_low_volume:'cs',lost_duplicate:'cs',cs_missing_dimensions:'cs',cs_endpoint_failed:'cs',
  enrique_only_no_contact:'enr',garimpo_no_channel:'enr',garimpo_no_contacts:'enr',invalid_produto_principal:'enr',
  lost_ps_low:'prod',gd_no_opportunity:'prod',bbp_neon_query_error:'prod',bbp_vc_monitoria_ausente:'prod'};
function conversaoHtml(w){
  const [a,b]=range(), LS=aggLoss(a,b), byStage={cs:[],enr:[],prod:[]};
  for(const r of (LS.reasons||[])){const s=STAGE_OF[r.key];if(s)byStage[s].push(r);}
  const sum=arr=>arr.reduce((s,r)=>s+r.count,0);
  const chips=arr=>{const tot=sum(arr)||1;return arr.slice(0,4).map(r=>`<span class="chip">${esc(r.label)} <b>${p0(r.count/tot*100)}</b></span>`).join('');};
  const inCS=w.csScored,adv=w.csApproved,lostCS=Math.max(0,inCS-adv),rA=inCS?adv/inCS*100:0,rL=inCS?lostCS/inCS*100:0;
  let h=`<div class="gates"><div class="gate">
    <div class="gate-h"><span class="gate-name">Company Score <small>Lia · pontuação → aprovação</small></span><span class="gate-sub">exato</span></div>
    <div class="gate-bar"><div class="ga" style="width:${Math.max(4,rA)}%">${rA>=8?nf.format(adv):''}</div><div class="gl" style="width:${Math.max(4,rL)}%">${rL>=8?nf.format(lostCS):''}</div></div>
    <div class="gate-lg"><span>Entraram <b>${nf.format(inCS)}</b></span><span class="ok">▲ <b>${nf.format(adv)}</b> avançaram (${pct(rA)})</span><span class="bad">▼ <b>${nf.format(lostCS)}</b> reprovados (${pct(rL)})</span></div>
    ${chips(byStage.cs)?`<div class="chips">${chips(byStage.cs)}</div>`:''}
  </div></div>`;
  const enrN=sum(byStage.enr), prodN=sum(byStage.prod);
  h+=`<div class="note"><span class="tag">Depois da aprovação — onde ainda se perde (${wlabel()})</span>
    <div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:8px">
      <div><b style="color:var(--leak)">${nf.format(enrN)}</b> perdas no <b>Enriquecimento</b>${chips(byStage.enr)?`<div class="chips" style="margin-top:6px">${chips(byStage.enr)}</div>`:''}</div>
      <div><b style="color:var(--leak)">${nf.format(prodN)}</b> perdas em <b>Produto / Golpes</b>${chips(byStage.prod)?`<div class="chips" style="margin-top:6px">${chips(byStage.prod)}</div>`:''}</div>
    </div>
    <div style="margin-top:9px;font-size:12px">Aqui são perdas <b>absolutas</b> por etapa (os % nos chips são a fatia dentro da etapa). A taxa de conversão por coorte exige o <span class="det" style="font-family:var(--mono)">/deals/flow</span> do Pipedrive, ainda não instrumentado.</div></div>`;
  return h;
}

function render(){
  if(!DATA)return;
  const [a,b]=range(), w=sumRange(a,b), days=nDays(a,b);
  const perDay=v=>nf.format(Math.round((v||0)/days))+'/dia';
  const yieldGate=w.csScored?w.csApproved/w.csScored*100:0, lossGate=100-yieldGate;
  const yieldE2E=w.created?w.csApproved/w.created*100:0;
  const rel=w.autoTotal?(1-w.infra/w.autoTotal)*100:100;
  const cache=w.semrushCalls?w.semrushHits/w.semrushCalls*100:0;
  const LS=aggLoss(a,b), recovPct=LS.total?LS.recuperavel/LS.total*100:0;
  const P=aggProviders(a,b);
  const O=DATA.openByStage||{}, represado=(O.golpes465||0)+(O.vm466||0);
  const custoQ=w.csApproved?(w.opecCost||0)/w.csApproved:0;
  document.getElementById('winlbl').textContent=wlabel();
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x.dataset.w===mode));
  document.getElementById('cbox').classList.toggle('show',mode==='custom');
  let h='';

  // ===== HERO — eficiência =====
  h+=`<div class="hero">
    <div class="thesis">De cada 100 leads pontuados, <b>${p0(yieldGate)}</b> passam — e <b>${p0(recovPct)}</b> do que perdemos era <b>recuperável</b>. O gargalo é critério, não volume.</div>
    <div class="effgrid">
      <div class="eff"><div class="v pass">${pct(yieldGate)}</div><div class="k"><b>Rendimento</b> do Company Score</div><div class="d">aprovados ÷ pontuados</div></div>
      <div class="eff"><div class="v leak">${pct(lossGate)}</div><div class="k"><b>Perda</b> no gate de qualificação</div><div class="d">${nf.format(w.csScored-w.csApproved)} reprovados</div></div>
      <div class="eff"><div class="v hold">${p0(recovPct)}</div><div class="k"><b>Vazamento recuperável</b> (falso negativo)</div><div class="d">${nf.format(LS.recuperavel||0)} de ${nf.format(LS.total||0)} perdas · ${wlabel()}</div></div>
      <div class="eff"><div class="v brand">${pct(yieldE2E)}</div><div class="k"><b>Rendimento ponta-a-ponta</b></div><div class="d">aprovados ÷ captados</div></div>
      <div class="eff"><div class="v leak">${nf.format(represado)}</div><div class="k"><b>Capital represado</b> (Golpes+VM)</div><div class="d">parados sem gatilho de avanço</div></div>
    </div></div>`;
  h+=alertsHtml(w,cache,LS);

  // ===== CONVERSÃO por etapa =====
  h+=`<div class="eyebrow">Entra · avança · perde</div><h2>Conversão por etapa <span class="tag">· ${wlabel()}</span></h2>`+conversaoHtml(w);

  // ===== FUNIL de conversão (com perda por etapa) =====
  h+=`<div class="eyebrow">Onde converte e onde vaza</div><h2>Funil de qualificação <span class="tag">· ${wlabel()}</span></h2>`;
  const base=Math.max(w.created,w.csScored,1);
  const drop1=w.created-w.csScored;
  h+=`<div class="card"><div class="fn">
    <div class="fn-stage"><div class="fn-lab">Captados<small>Lead Generator</small></div><div class="fn-track"><div class="fn-fill" style="width:${w.created/base*100}%">${nf.format(w.created)}</div></div><div class="fn-n">${nf.format(w.created)}<small>100%</small></div></div>
    <div class="fn-gap"><div class="fn-conv">${drop1>=0?`↓ pontuados no Company Score`:`↓ inclui backlog de coortes anteriores`}</div></div>
    <div class="fn-stage"><div class="fn-lab">Pontuados<small>Lia · Company Score</small></div><div class="fn-track"><div class="fn-fill" style="width:${w.csScored/base*100}%">${nf.format(w.csScored)}</div></div><div class="fn-n">${nf.format(w.csScored)}</div></div>
    <div class="fn-gap"><div class="fn-conv"><span class="keep">▲ ${pct(yieldGate)} passa</span> · <span class="drop">▼ ${pct(lossGate)} perde (${nf.format(w.csScored-w.csApproved)})</span></div></div>
    <div class="fn-stage"><div class="fn-lab">Aprovados<small>seguem no funil</small></div><div class="fn-track"><div class="fn-fill pass" style="width:${Math.max(2,w.csApproved/base*100)}%">${nf.format(w.csApproved)}</div></div><div class="fn-n" style="color:var(--pass)">${nf.format(w.csApproved)}<small>${pct(yieldGate)}</small></div></div>
    <div class="fn-gap"><div class="fn-conv">↓ garimpo &amp; produto → prospecção</div></div>
    <div class="fn-stage"><div class="fn-lab">Prospecção<small>SDR · abertos agora</small></div><div class="fn-track"><div class="fn-fill" style="width:${Math.max(2,(O.prospeccao434||0)/base*100)}%;background:var(--teal)">${nf.format(O.prospeccao434||0)}</div></div><div class="fn-n">${nf.format(O.prospeccao434||0)}<small>snapshot</small></div></div>
  </div>
  <div class="note"><span class="tag">Como ler</span>Volume por etapa no período (a Lia re-pontua e drena backlog, então não é coorte única). A conversão exata é <b>no gate do Company Score</b>: <b>${pct(yieldGate)}</b> passa, <b>${pct(lossGate)}</b> perde. Custo por lead qualificado (Apollo ext.): <b>${money(custoQ)}</b>.</div></div>`;

  // ===== Histograma =====
  const H=aggCs(a,b);
  if(H&&H.distinctDeals){
    const hmax=Math.max(...H.buckets.map(x=>x.total),1), below=H.buckets.filter(x=>x.range==='0–1'||x.range==='1–2').reduce((s,x)=>s+x.total,0);
    h+=`<div class="eyebrow">Por que reprova tanto</div><h2>Distribuição do Company Score <span class="tag">· ${wlabel()} · corte ${String(H.threshold).replace('.',',')}</span></h2>`;
    h+=`<div class="card"><div class="histo">`;
    for(const x of H.buckets){const cut=(x.range==='1–2');
      h+=`<div class="col"><span class="cn">${nf.format(x.total)}</span><div class="stk ${cut?'cutline':''}" style="height:${x.total/hmax*100}%"><div class="a" style="height:${x.total?x.approved/x.total*100:0}%"></div><div class="r" style="height:${x.total?x.reproved/x.total*100:0}%"></div></div><span class="cl">${x.range}</span></div>`; }
    h+=`</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-dim)"><span><i style="display:inline-block;width:10px;height:10px;background:var(--pass);border-radius:2px"></i> aprovado</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--leak);border-radius:2px"></i> reprovado</span><span style="margin-left:auto">score médio — aprovado <b style="color:var(--pass)">${String(H.avgApproved).replace('.',',')}</b> · reprovado <b style="color:var(--leak)">${String(H.avgReproved).replace('.',',')}</b></span></div>`;
    h+=`<div class="note"><span class="tag">Leitura</span><b>${p0(below/H.distinctDeals*100)}</b> das ${nf.format(H.distinctDeals)} pontuações do período ficam abaixo do corte — a massa vive em 0–1. Corte apertado demais ou lead de entrada fraco?</div></div>`;
  }

  // ===== Motivos de perda =====
  h+=`<div class="eyebrow">Natureza da perda</div><h2>Motivos de descarte <span class="tag">· ${wlabel()}</span></h2>`;
  if(LS.total){h+=`<div class="comp">
    <div style="width:${LS.recuperavel/LS.total*100}%;background:var(--hold);color:var(--brand-ink)">Recuperável · ${p0(LS.recuperavel/LS.total*100)}</div>
    <div style="width:${LS.legitima/LS.total*100}%;background:var(--teal);color:var(--brand-ink)">Legítima</div>
    <div style="width:${LS.tecnico/LS.total*100}%;background:var(--leak);color:#fff">Téc.</div></div>`;}
  h+=`<div class="card"><div class="bars">`;
  const R=LS.reasons||[], rmax=R.length?Math.max(...R.map(r=>r.count)):1;
  for(const r of R){const arr=r.rpd7>r.rpd*1.15?'<span class="up">▲</span>':(r.rpd7<r.rpd*.85?'<span class="dn">▼</span>':'▬');const s=r.tecnico?'<span class="selo tec">TÉC</span>':(r.recoverable?'<span class="selo rec">RECUP</span>':'');
    h+=`<div class="row"><span class="l">${r.label} ${s}</span><span class="t"><span class="f" style="width:${r.count/rmax*100}%;background:${r.tecnico?'var(--leak)':(r.recoverable?'var(--hold)':'var(--teal)')}"></span></span><span class="n">${nf.format(r.count)} <small>${pct(r.share)}</small><br><small>${r.rpd7}/d ${arr}</small></span></div>`; }
  h+=`</div>${LS.total?`<div class="note leak"><span class="tag">Alavanca de receita</span><b>${p0(recovPct)}</b> das perdas são <b>recuperáveis</b> (falso negativo re-drivável). Só ${p0(LS.legitima/LS.total*100)} é descarte de negócio legítimo. Auditar/reprocessar essa fatia é o maior ganho de pipeline.</div>`:''}</div>`;

  // ===== Funil ao vivo por etapa =====
  const STG=[['Novo Lead','novo460'],['Requalificação','requa461'],['Company Score','cs462'],['Product BB','bb463'],['Product BBP','bbp464'],['Product Golpes','golpes465'],['Product VM','vm466'],['Garimpo','garimpo467'],['Prospecção','prospeccao434']];
  const omax=Math.max(...STG.map(([,k])=>O[k]||0),1);
  h+=`<div class="eyebrow">Estado agora</div><h2>Cards abertos por etapa <span class="tag">· snapshot</span></h2><div class="card"><div class="bars">`;
  for(const [lbl,k] of STG){const v=O[k]||0, stuck=(k==='golpes465'||k==='vm466');
    h+=`<div class="row"><span class="l">${lbl}${stuck?' <span class="selo tec">travado</span>':''}</span><span class="t"><span class="f" style="width:${v/omax*100}%;background:${stuck?'var(--leak)':'var(--brand)'}"></span></span><span class="n">${nf.format(v)}</span></div>`; }
  h+=`</div><div class="note leak"><span class="tag">Gargalo estrutural</span><b>${nf.format(represado)} cards represados em Golpes + VM</b> — sem score de produto (só BB e fraude têm gatilho). Capital parado.</div></div>`;

  // ===== Por projeto =====
  h+=`<div class="eyebrow">Por projeto</div><h2>Lead Generator · Lia · Enrique</h2><div class="proj3">`;
  h+=`<div class="card pc"><div class="ph">Lead Generator <small>captação</small></div>
    <div class="pm"><span>Leads captados</span><span class="pv">${nf.format(w.created)}</span></div>
    <div class="pm"><span>Qualificados (Lia)</span><span class="pv" style="color:var(--pass)">${nf.format(w.csApproved)}</span></div>
    <div class="pm"><span>Taxa de qualificação</span><span class="pv">${pct(yieldE2E)}</span></div>
    <div class="pm"><span>Ritmo</span><span class="pv">${perDay(w.created)}</span></div></div>`;
  h+=`<div class="card pc"><div class="ph">Lia <small>qualificação</small></div>
    <div class="pm"><span>Pontuados</span><span class="pv">${nf.format(w.csScored)}</span></div>
    <div class="pm"><span>Aprovados</span><span class="pv" style="color:var(--pass)">${nf.format(w.csApproved)}</span></div>
    <div class="pm"><span>Reprovados</span><span class="pv" style="color:var(--leak)">${nf.format(w.csScored-w.csApproved)}</span></div>
    <div class="pm"><span>Confiabilidade</span><span class="pv" style="color:var(--pass)">${pct(rel)}</span></div></div>`;
  const c=DATA.contacts||{}, cn=w.contactsNew||0;
  h+=`<div class="card pc"><div class="ph">Enrique <small>garimpo · período</small></div>
    <div class="pm"><span>Contatos encontrados</span><span class="pv">${nf.format(cn)}</span></div>
    <div class="pm"><span>E-mails válidos</span><span class="pv" style="color:var(--pass)">${nf.format(w.cVerified||0)}</span></div>
    <div class="pm"><span>Cobertura e-mail/LinkedIn</span><span class="pv">${cn?Math.round(w.cEmail/cn*100):0}% / ${cn?Math.round(w.cLinkedin/cn*100):0}%</span></div>
    <div class="pm"><span>Créditos Apollo (ext.)</span><span class="pv">${nf.format(w.opecCredits||0)} · ${money(w.opecCost||0)}</span></div></div>`;
  h+=`</div>`;

  // ===== Custo / API =====
  h+=`<div class="eyebrow">Custo & integrações</div><h2>Semrush — custo &amp; cache <span class="tag">· período</span></h2>`+semrushHtml(w,cache);
  h+=`<h2>Consumo por API — Enrique <span class="tag">· ${wlabel()}</span></h2>`+providersHtml(P);
  h+=`<h2>Lead Generator — por que descarta <span class="tag">· 30d</span></h2>`+leadgenHtml();

  // ===== Tendência =====
  h+=`<div class="eyebrow">Tendência</div><h2>Comparativo por janela <span class="tag">· ritmo/dia</span></h2>`+cmpHtml();

  // ===== PAINEL DE OPERAÇÃO — por último, agrupado por sistema =====
  h+=`<div class="eyebrow">Operação — o que corrigir</div><h2>Erros &amp; anomalias por sistema <span class="tag">· últimos 30d</span></h2>`+opsHtml();
  document.getElementById('app').innerHTML=h;
}

function alertsHtml(w,cache,LS){
  const A=[], O=DATA.openByStage||{};
  if(w.semrushCalls>50&&cache<5)A.push(['red','Crítico',`Cache Semrush em ${pct(cache)} (ideal ≥ 30%) — crédito queimado re-consultando.`]);
  const nc=(LS.reasons||[]).find(r=>r.key==='enrique_only_no_contact');
  if(nc&&nc.rpd7>nc.rpd*1.3)A.push(['red','Crítico',`"Sem contato" acelerando — ${nc.rpd7}/dia (7d) vs ${nc.rpd}/dia (período).`]);
  if(((O.golpes465||0)+(O.vm466||0))>100)A.push(['red','Crítico',`${nf.format((O.golpes465||0)+(O.vm466||0))} cards represados em Golpes+VM sem gatilho de avanço.`]);
  if(LS.total&&LS.recuperavel/LS.total>0.5)A.push(['amber','Atenção',`${p0(LS.recuperavel/LS.total*100)} das perdas são recuperáveis — pipeline jogado fora.`]);
  const rel=w.autoTotal?(1-w.infra/w.autoTotal)*100:100;
  A.push([rel>=99?'green':'amber',rel>=99?'OK':'Atenção',`Confiabilidade ${pct(rel)} (${nf.format(w.infra)} erros de infra no período).`]);
  return `<div class="alerts">`+A.map(x=>`<div class="al ${x[0]}"><span class="dot"></span><div class="tx">${x[2]}</div><span class="st">${x[1]}</span></div>`).join('')+`</div>`;
}
function cmpHtml(){
  const t=DATA.todayBRT||Object.keys(DATA.daily||{}).sort().pop(), wins=[['7',6],['15',14],['30',29]];
  const data=wins.map(([l,n])=>({l,d:sumRange(dayMinus(t,n),t),days:+l}));
  const metric=(key,title,color,rate)=>{const vals=data.map(x=>rate?(x.d.csScored?x.d.csApproved/x.d.csScored*100:0):x.d[key]/x.days),mx=Math.max(...vals,.001);
    return `<div class="cmpc"><div class="ct">${title}</div><div class="cbars">`+data.map((x,i)=>`<div class="cb"><span class="cvv">${rate?vals[i].toFixed(1):nf.format(Math.round(vals[i]))}</span><div class="cbar" style="height:${Math.max(6,vals[i]/mx*100)}%;background:${color}"></div><span class="cl">${x.l}d</span></div>`).join('')+`</div></div>`;};
  return `<div class="cmp">`+metric('created','Captados / dia','var(--brand)')+metric('lost','Perdidos / dia','var(--leak)')+metric('csRate','Aprovação Lia (%)','var(--pass)',true)+metric('semrushUnits','Semrush units / dia','var(--hold)')+`</div>`;
}
function semrushHtml(w,cache){
  const crit=cache<5, t=DATA.todayBRT||Object.keys(DATA.daily||{}).sort().pop(), days=[];
  for(let i=13;i>=0;i--){const k=dayMinus(t,i);days.push((DATA.daily&&DATA.daily[k])?DATA.daily[k].semrushUnits:0);}
  const smax=Math.max(...days,1);
  return `<div class="card"><div class="kpis" style="margin-top:0"><div class="kpi"><div class="v hold">${nf.format(w.semrushUnits||0)}</div><div class="k">Units consumidas</div></div><div class="kpi"><div class="v">${nf.format(w.semrushCalls||0)}</div><div class="k">Chamadas</div></div><div class="kpi"><div class="v ${crit?'leak':'pass'}">${pct(cache)}</div><div class="k">Cache hit</div></div></div><div class="spark">${days.map(v=>`<div style="height:${v/smax*100}%"></div>`).join('')}</div><div style="font:11px var(--mono);color:var(--ink-faint);margin-top:6px">units/dia · últimos 14 dias</div>${crit?`<div class="note leak"><span class="tag">Dreno de crédito</span>Cache em <b>${pct(cache)}</b> — quase toda consulta é cobrada. Consertar o cache é economia direta.</div>`:''}</div>`;
}
function providersHtml(P){
  P=P||DATA.providers||[];
  if(!P.length)return `<div class="note"><span class="tag">Aguardando fonte</span>Consumo por API (Apollo · Findymail · FullEnrich · Debounce · CNPJá) com chamadas, taxa de erro, créditos e R$ vive no schema <b>garimpo</b> do Enrique. Adicionar o secret <b>ENRIQUE_SERVICE_ROLE_KEY</b> popula este painel sozinho.</div>`;
  const cmax=Math.max(...P.map(p=>p.credits),1);
  return `<div class="tw"><table><thead><tr><th>Provider</th><th class="r">Chamadas</th><th class="r">Sucesso</th><th class="r">Erro</th><th class="r">Créditos</th><th class="r">R$</th></tr></thead><tbody>`+P.map(p=>{const col=p.successRate>=70?'var(--pass)':(p.successRate>=40?'var(--hold)':'var(--leak)');return `<tr><td><b>${p.name}</b></td><td class="r num">${nf.format(p.calls)}</td><td class="r num" style="color:${col}">${p.successRate}%</td><td class="r num" style="color:var(--leak)">${p.errorRate}%</td><td class="r num">${nf.format(p.credits)}</td><td class="r num">${p.brl?money(p.brl):'—'}</td></tr>`;}).join('')+`</tbody></table></div>`;
}
function leadgenHtml(){
  const L=DATA.leadgen;
  if(!L||!L.skipped)return `<div class="note"><span class="tag">Aguardando fonte</span>Motivos de descarte do Lead Generator (dedup, marca de cliente, domínio inválido, falha técnica) vivem em <b>qualification_leads_run</b> — no Supabase do Lead Generator (não é a mesma instância da Lia). Adicionar <b>LEADGEN_SUPABASE_URL / LEADGEN_SERVICE_ROLE_KEY</b> popula este painel.</div>`;
  const mmax=Math.max(...L.reasons.map(r=>r.count),1);
  return `<div class="card"><div class="kpis" style="margin-top:0"><div class="kpi"><div class="v pass">${nf.format(L.created)}</div><div class="k">Criados</div></div><div class="kpi"><div class="v brand">${nf.format(L.reopened)}</div><div class="k">Reabertos</div></div><div class="kpi"><div class="v leak">${nf.format(L.skipped)}</div><div class="k">Descartados</div></div></div><div class="bars" style="margin-top:14px">`+L.reasons.map(r=>`<div class="row"><span class="l">${r.label} ${r.tecnico?'<span class="selo tec">TÉC</span>':''}</span><span class="t"><span class="f" style="width:${r.count/mmax*100}%;background:${r.tecnico?'var(--leak)':'var(--teal)'}"></span></span><span class="n">${nf.format(r.count)}</span></div>`).join('')+`</div></div>`;
}
function gargalosHtml(w,cache,LS,P){
  const O=DATA.openByStage||{},rows=[];LS=LS||DATA.lossSummary||{};P=P||DATA.providers||[];
  const st=(O.golpes465||0)+(O.vm466||0);
  if(st>100)rows.push(['leak','Crítico','Lia',`Golpes + VM represados (${nf.format(st)} cards)`,'Implementar score de produto/gatilho de avanço p/ GD e VM; enquanto isso, mutirão manual.']);
  if((LS.recuperavel||0)>500)rows.push(['leak','Falso negativo','Lia',`${nf.format(LS.recuperavel)} perdas recuperáveis (${p0(LS.recuperavel/(LS.total||1)*100)})`,'Auditar amostra de weak_pure_brand + trilha de reprocessamento.']);
  if(cache<5&&w.semrushCalls>50)rows.push(['amber','Atenção','Enrique/RevOps',`Cache Semrush em ${pct(cache)}`,'Consertar o cache pra parar de re-consultar e queimar crédito.']);
  const bad=P.filter(p=>p.errorRate>=60&&p.calls>50);if(bad.length)rows.push(['amber','Atenção','Enrique',`Waterfall com baixo acerto: ${bad.map(p=>p.name).join(', ')}`,'Reordenar/cortar providers de baixo yield.']);
  rows.push(['brand','Oportunidade','RevOps','Conversão por etapa invisível','Ligar coletor do /deals/flow do Pipedrive p/ conversão por coorte e mortalidade por etapa.']);
  if(!P.length)rows.push(['amber','Pendência','RevOps','Custo por API do garimpo cego','Adicionar ENRIQUE_SERVICE_ROLE_KEY.']);
  if(!DATA.leadgen||!DATA.leadgen.skipped)rows.push(['amber','Pendência','RevOps','Descartes do Lead Generator cegos','Adicionar creds do Supabase do Lead Generator.']);
  const sc={leak:'var(--leak)',amber:'var(--hold)',brand:'var(--brand)'};
  return `<div class="card">`+rows.map(r=>`<div class="gk"><span class="gd" style="background:${sc[r[0]]}"></span><div><div class="gt">${r[3]} <span class="sv" style="color:${sc[r[0]]}">· ${r[1]}</span></div><div class="gw">${r[4]}</div></div><span class="go">dono: ${r[2]}</span></div>`).join('')+`</div>`;
}
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.w;if(mode==='custom'&&!cFrom){const t=DATA.todayBRT;cFrom=dayMinus(t,29);cTo=t;document.getElementById('fromD').value=cFrom;document.getElementById('toD').value=cTo;}render();});
document.getElementById('applyC').addEventListener('click',()=>{const f=document.getElementById('fromD').value,t=document.getElementById('toD').value;if(f&&t){cFrom=f<=t?f:t;cTo=f<=t?t:f;mode='custom';render();}});
function init(){
  document.getElementById('upd').innerHTML='· atualizado <b>'+(DATA.generatedAtBRT||'?')+'</b>';
  const mx=DATA.todayBRT||Object.keys(DATA.daily||{}).sort().pop();if(mx){const mn=dayMinus(mx,29);['fromD','toD'].forEach(id=>{const el=document.getElementById(id);if(el){el.min=mn;el.max=mx;}});}
  let f='Dados reais · Pipedrive brandmonitor + Supabase Lia + API OPEC Enrique · atualização diária (GitHub Action).';
  if(DATA.warnings&&DATA.warnings.length)f+=' Pendências: '+DATA.warnings.join(' · ');
  document.getElementById('foot').textContent=f; render();
}
(async function(){
  if(window.__DATA__){DATA=window.__DATA__;init();return;}
  try{DATA=await (await fetch('data.json?t='+Date.now())).json();init();}
  catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent='Não carregou data.json — rode npm run collect ou aguarde a GitHub Action. '+e.message;}
})();
</script>
